# En repos públicos, GitHub desactiva los workflows programados tras 60 días sin actividad en el repo.
# Como los datos se escriben en invest-data, este repo podría quedar "inactivo". Este workflow hace un
# commit mensual mínimo para mantener viva la programación.

name: Mantenimiento mensual

on:
  schedule:
    - cron: "41 13 1 * *"   # día 1 de cada mes, 08:41 en Bogotá
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    # No corre hasta configurar la variable DATA_REPO y el secreto DATA_REPO_TOKEN (docs/configurar_github.md)
    if: ${{ vars.DATA_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Registrar latido
        run: |
          date -u +%FT%TZ > docs/latido.txt
          git config user.name "invest-bot"
          git config user.email "invest-bot@users.noreply.github.com"
          git add docs/latido.txt
          git commit --quiet -m "Latido mensual $(date -u +%F)" || echo "Sin cambios"
          git push --quiet

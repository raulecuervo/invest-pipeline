[project]
name = "invest"
version = "0.1.0"
description = "Sistema personal de análisis de activos financieros: Colombia (Bolsa de Colombia) y escalamiento por país"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "exchange-calendars>=4.5",
    "pandas>=2.0",
    "anthropic>=0.60",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Conectores que corren en el PC con navegador (Bolsa de Colombia). Luego: uv run playwright install chromium
pc = ["playwright>=1.48"]
# Aplicativo local (invest app): servidor web pequeño que lee modelo.duckdb
app = ["fastapi>=0.110", "uvicorn>=0.29", "pypdfium2>=4.30", "pillow>=10.0"]

[project.scripts]
invest = "invest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

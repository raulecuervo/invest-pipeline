# Correcciones manuales del enlace entre la entidad que publica información relevante en la SFC
# y el emisor de la acción (código de 5 caracteres de la especie: coc04 = Ecopetrol).
#
# El enlace automático solo acepta nombres idénticos tras normalizarlos. Cuando una entidad que sí
# tiene acciones inscritas queda sin emisor_id en gold/fact_evento_corporativo, se agrega aquí:
#
#   - entidad: "BANCOLOMBIA S.A."
#     emisor: cotk7        # sus eventos quedan con el emisor de Grupo Cibest
#
# Una entidad con emisor vacío ("") se deja sin enlazar a propósito. Con `exacta: true` se compara el
# nombre completo (sin tildes ni mayúsculas), para nombres cuya forma reducida es genérica.

alias:
  # El nombre reducido sería "ADMINISTRADORA DE FONDOS DE PENSIONES" (corta en la coma), el mismo de Porvenir
  - entidad: 'ADMINISTRADORA DE FONDOS DE PENSIONES, CESANTIA Y DEL COMPONENTE COMPLEMENTARIO DE AHORRO INDIVIDUAL PROTECCION S.A. pudiéndose identificar también con la sigla "PROTECCION"'
    emisor: cow19
    exacta: true
  # La especie es "AO BOLSA NACIONAL AGROPECUARIA S.A."; la entidad publica como BMC desde 2010
  - entidad: "BMC BOLSA MERCANTIL DE COLOMBIA S.A."
    emisor: cor02

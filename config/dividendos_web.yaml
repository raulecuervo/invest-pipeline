# Dividendos en efectivo tomados de páginas públicas (ver src/invest/dividendos_web.py).
#
# Los historiales se copian a mano (navegador) en invest-data/fuentes_web/dividendos/<fuente>/
# y NO se redistribuyen: invest-data es privado. Investing.com publica el historial completo;
# stockanalysis.com solo los últimos 20 pagos y parece usar el mismo proveedor, así que sirve para
# descartar duplicados y repartos que no son en efectivo, no como fuente independiente. Las
# verificaciones independientes son la regla del periodo ex-dividendo de la BVC, el precio de la
# SFC y los avisos de información relevante de la SFC.
desde: 2007-01-01            # el histórico de eventos de la SFC empieza en 2007
rendimiento_maximo: 0.15     # un pago mayor que 15 % del precio anterior se revisa a mano
veces_mediana: 8             # un pago 8 veces mayor o menor que la mediana del año se revisa
tolerancia_valor: 0.01
dias_duplicado: 5            # mismo valor en la misma acción a 5 días o menos: es el mismo pago
dias_evento_antes: 450       # el aviso de la SFC sobre el dividendo debe estar en esta ventana
dias_evento_despues: 15
fuentes:
  investing: {carpeta: fuentes_web/dividendos/investing, ajustado_por_splits: true}
  stockanalysis: {carpeta: fuentes_web/dividendos/stockanalysis, ajustado_por_splits: true}
activos:
  - {especie: cot13paao004, investing: gruposura, stockanalysis: GRUPOSURA}
  - {especie: cot13paad031, investing: pfgrupsura, stockanalysis: PFGRUPSURA}
  - {especie: coc04paao008, investing: ecopetrol-cn, stockanalysis: ECOPETROL}
  - {especie: cod38paao005, investing: cemargos, stockanalysis: CEMARGOS}
  - {especie: cod38paad115, investing: pfcemargos, stockanalysis: PFCEMARGOS}
  - {especie: coe15paao001, investing: isa, stockanalysis: ISA}
  - {especie: cot09paao003, investing: grupoargos, stockanalysis: GRUPOARGOS}
  - {especie: cot09paad006, investing: pfgrupoarg, stockanalysis: PFGRUPOARG}
  - {especie: cog31paao003, investing: exito, stockanalysis: EXITO}
  - {especie: cot29paad012, investing: pfaval, stockanalysis: PFAVAL}
  - {especie: cot29paao001, investing: grupoaval, stockanalysis: GRUPOAVAL}
  - {especie: cob51paad096, investing: pfdavvnda, stockanalysis: PFDAVVNDA}

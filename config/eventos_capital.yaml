# Distribuciones en especie: escisiones y repartos de acciones de otra sociedad.
#
# En estos eventos el accionista conserva su acción y recibe además acciones de otra empresa. El
# precio de su acción cae en lo entregado, así que sin este ajuste el retorno total muestra una
# pérdida que no ocurrió. invest dims convierte esta lista en gold/fact_distribucion_especie y el
# retorno total suma lo entregado como si fuera un dividendo pagado en especie:
#
#     valor entregado por acción = Σ acciones_por_accion × precio de la acción recibida
#     retorno_total = (P_t + dividendo + valor entregado) / P_(t-1) − 1
#
# Campos:
#   especie        acción que reparte (código SFC)
#   fecha_ex       primera rueda en que la acción negocia sin el derecho (después de la suspensión)
#   tipo           escision | reparto_acciones
#   entrega        lista de lo que recibe cada acción:
#     especie            acción recibida (código SFC); vacío si no cotiza en la SFC
#     nombre             para leer la tabla
#     acciones_por_accion  relación de reparto oficial
#     precio_referencia  precio a usar si la acción recibida no negoció en los 10 días siguientes a
#                        fecha_ex (debut tardío o fuera del universo SFC); se anota la fuente
#   fuente         de dónde sale la relación
#
# Los dividendos que se pagan en acciones propias SOLO a quien lo acepta (Aval y Banco de Bogotá
# en 2022, artículo 455 del Código de Comercio) no van aquí: quien no responde recibe el efectivo,
# así que se tratan como dividendo en efectivo en revision/dividendos_web.csv.
#
# Revisado por Claude el 23-nov-2026 con los avisos de la SFC y prensa económica (ver fuente).

ventana_precio_dias: 10

eventos:

  # ---- BAC Holding International (mar-2022): Banco de Bogotá y Grupo Aval escinden BHI
  - especie: cob01paao006          # Banco de Bogotá
    fecha_ex: 2022-03-30
    tipo: escision
    entrega:
      - especie: pat07paao009
        nombre: BAC Holding International (BHI)
        acciones_por_accion: 97.848
        precio_referencia: 291       # precio de referencia de inscripción en la BVC; BHI negoció desde el 19-abr-2022
    fuente: "La República 30-mar-2022 y 19-abr-2022: 97.848 acciones de BHI por acción del Banco de Bogotá; precio de referencia $291"

  - especie: cot29paao001          # Grupo Aval ordinaria

# Equivalencias nemotécnico de la Bolsa de Colombia → especie SFC (código ISIN en minúscula).
#
# La SFC identifica cada acción por su especie (p. ej. coc04paao008) y la Bolsa de Colombia por su
# nemotécnico (ECOPETROL). Esta tabla las une para cruzar el cierre, máximo y mínimo de la Bolsa con
# el precio promedio y los eventos de la SFC. Armada el 23-nov-2026 con la tabla "Mercado local en
# línea" y dim_activo; un nemotécnico nuevo sin equivalencia queda en la tabla con especie vacía y
# se avisa en la bitácora.
#
# clase: accion | etf | otro (TEIS, títulos participativos). Solo las acciones tienen especie SFC
# de acciones.


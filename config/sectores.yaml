# Sector económico de cada emisor, para mostrar y comparar en el aplicativo (screener, valoración, ficha:
# "Comparación con su sector", mapa del mercado).
#
# La SFC clasifica por tipo de entidad, no por negocio: Ecopetrol, GEB, ISA y ETB salen como "Entidades
# públicas" y Celsia o Cibest como "Sociedades inversoras". Esta lista agrupa por lo que hace la empresa.
# Un emisor que no esté aquí muestra el sector de la SFC.
#
# El puntaje de factores sigue comparando con los pares del sector de la SFC cuando hay 8 o más en el
# universo (config/escala.yaml, minimo_pares); cambiar ese grupo cambia los puntajes y queda por decidir.
#
# Revisado por Claude el 24-nov-2026.

por_emisor:
  # Bancos y holdings bancarios
  CO-COB01: Bancos          # Banco de Bogotá
  CO-COB02: Bancos          # Banco Popular
  CO-COB07: Bancos          # Bancolombia (hasta may-2025)
  CO-COB13: Bancos          # BBVA Colombia
  CO-COB23: Bancos          # Banco de Occidente
  CO-COB51: Bancos          # Davivienda
  CO-COB52: Bancos          # AV Villas

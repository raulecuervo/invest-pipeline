# Catálogo de fuentes de datos (documentación viva).
# Cada conector lee su entrada de aquí. Al agregar una fuente nueva, se registra primero en este archivo.
#
# Campos:
#   acceso:      api_socrata | api_rest | descarga_xlsx | html_estatico | navegador (Playwright) | manual
#   frecuencia:  intradia | diaria | semanal | mensual | trimestral | semestral | anual
#   recarga_dias: días hacia atrás que se re-descargan para captar correcciones
#   ejecuta_en:  actions (GitHub Actions, repo público) | pc (Programador de tareas de Windows) | manual
#   redistribuible: si los datos se pueden publicar. Si es false, solo van al repo privado invest-data
#   estado:      implementado | pendiente | fuera_de_alcance
#   fase:        fase de la hoja de ruta en que se implementa

fuentes:

  # ---------------------------------------------------------------- Divisas
  - id: trm_datos_gov
    nombre: TRM (Superintendencia Financiera en datos.gov.co)
    tipo_dato: divisas
    url: https://www.datos.gov.co/resource/32sa-8pi3.json
    acceso: api_socrata
    frecuencia: diaria
    ventana_publicacion: "tarde del día hábil anterior a su vigencia; cubre fines de semana y festivos"
    recarga_dias: 10
    ejecuta_en: actions
    licencia: datos abiertos del Estado colombiano
    redistribuible: true
    estado: implementado
    fase: 0
    historico_desde: "1991-11-27"
    tabla_destino: fact_fx_diaria

  # ------------------------------------------------------------ Renta variable
  - id: bvc_web
    nombre: Bolsa de Colombia, página web (cierre, máximo, mínimo, volumen)
    tipo_dato: precios_acciones
    url: https://www.bvc.com.co
    acceso: navegador
    frecuencia: diaria
    ventana_publicacion: "15 minutos de retraso; extraer unas 2 horas después del cierre"
    recarga_dias: 5
    ejecuta_en: manual   # la BVC bloquea (403) los navegadores sin ventana; se lanza a mano, nunca programado
    licencia: términos de uso de la Bolsa de Colombia; uso personal
    redistribuible: false
    estado: implementado
    fase: 1
    tabla_destino: fact_precio_bvc
    requiere: "extra pc (uv sync --extra pc) y una vez: uv run playwright install chromium"
    nota: "La API rest.bvc.com.co exige un token de sesión (/api/handshake) que la web entrega a su propio sitio; no se replica. Su CDN responde 403 a los navegadores sin ventana y no se esquiva: es lectura manual. Esteban la lanza y se abre una ventana de Chromium con la página 'Mercado local en línea', de la que se lee la tabla del día (cierre, apertura, máximo, mínimo, promedio, volumen, cantidad). Solo después de las 16:15 de un día bursátil. Desde el 25-nov-2026 recupera además los días hábiles de las últimas 10 sesiones que falten, con el filtro de fecha de la misma página (un día se guarda solo si la tabla cambió; se detiene en el primero que la Bolsa no entrega). Equivalencias nemotécnico → especie en config/nemotecnicos.yaml"

  - id: bvc_en_curso
    nombre: Bolsa de Colombia, precio en curso durante la sesión (15 minutos de retraso)
    tipo_dato: precios_acciones
    url: https://www.bvc.com.co/mercado-local-en-linea?tab=renta-variable_mercado-local
    acceso: navegador
    frecuencia: a_pedido
    ventana_publicacion: "15 minutos de retraso, durante la sesión"
    recarga_dias: 0
    ejecuta_en: manual   # la lanza Esteban (botón "Ver precios de ahora" del aplicativo); nunca programada
    licencia: términos de uso de la Bolsa de Colombia; uso personal
    redistribuible: false
    estado: implementado
    fase: 1
    tabla_destino: fact_precio_bvc_en_curso
    requiere: "extra pc (uv sync --extra pc) y una vez: uv run playwright install chromium"
    nota: "La misma tabla de bvc_web leída mientras el mercado está abierto. Una fila por día y nemotécnico con la última lectura (hora_lectura) y el estado de la página; nunca se guarda como cierre. El aplicativo la muestra en la Ficha, Mercado y Mi cartera solo mientras no haya cierre de ese día."


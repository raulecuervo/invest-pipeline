    bronze_en_repositorio: false
    nota: "Consulta mes a mes con tema Todos. Anexos (PDF) de dividendos y cambios de capital de emisores con acciones (últimos 400 días) y estados financieros (informe periódico trimestral y de fin de ejercicio, últimos 800 días) de los emisores con estados_desde_sfc en config/estados_compania.yaml, en invest-data/anexos/sfc/; los de más de 60 MB no se guardan. Categoría y emisor se asignan en gold/fact_evento_corporativo"

  - id: sfc_rnve_niif
    nombre: SFC, estados financieros NIIF de emisores (SIMEV / RNVE), XBRL
    tipo_dato: fundamentales
    url: https://www.superfinanciera.gov.co/SIMEV2/rnve
    acceso: navegador
    frecuencia: trimestral
    ventana_publicacion: "45 días tras el corte (60 para el cierre anual)"
    recarga_dias: 0
    ejecuta_en: pc
    licencia: información pública
    redistribuible: true
    bronze_en_repositorio: false   # unos 5 MB de XBRL por informe: no van al repositorio
    estado: implementado
    fase: 1
    tabla_destino: fact_anexo_sfc   # el XBRL, donde exista, va a fact_xbrl_sfc
    columna_fecha: fecha_corte
    historico_desde: "2015-03-31"
    dias_tras_corte: 30
    max_informes_por_corrida: 80    # unos 60 minutos por corrida
    requiere: "extra pc (uv sync --extra pc) y una vez: uv run playwright install chromium"
    nota: "La página del SIMEV pide los archivos a un servicio con clave propia del sitio: no se replica. Playwright elige año, tipo de informe y periodo en la página de cada emisor y guarda el XBRL que la página recibe. Consolidado si existe, si no separado. Anexos (141 información económica general: valor patrimonial y utilidad por acción, dividendos, ventas, empleados; 211 acciones y accionistas; 529 principales accionistas; 058 subordinadas) de todos los emisores en fact_anexo_sfc. XBRL solo donde el SIMEV lo publica (Ecopetrol sí; Celsia, Cementos Argos y Grupo Argos no, nov-2026): hechos sin dimensiones, del periodo y del comparativo, con corte y fecha de transmisión, en fact_xbrl_sfc; montos en miles de pesos, por acción en pesos. Emisores y sus códigos SIMEV en config/emisores_rnve.yaml. La carga inicial (36 emisores × 43 cortes, unas 17 horas de navegador) se completa en varias corridas de 80: primero el último año, luego los cierres anuales desde 2015 y al final los demás trimestres"


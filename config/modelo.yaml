# Catálogo del modelo de datos (src/invest/modelo.py): una entrada por tabla que lee el aplicativo.
#
# capa y ruta dicen dónde está el Parquet (dentro de invest-data); grano y claves, qué identifica una
# fila (invest modelo verifica que las claves no se repitan); columnas, el nombre y tipo que se
# garantiza (puede haber más). pagina: dónde la usa el aplicativo. La explicación de cada variable
# para el usuario vive en config/variables/ (dim_variable).
tablas:
  dim_activo:
    capa: gold
    ruta: dims/dim_activo.parquet
    descripcion: "Acciones de la Bolsa de Colombia (especies de la SFC) con emisor, clase, nemotécnico, sector, bursatilidad y rango de negociación"
    grano: "especie"
    claves: [especie]
    pagina: "todas"
    columnas:
      activo_id: String
      especie: String
      nemotecnico: String
      nombre: String
      emisor_id: String
      clase_accion: String
      clase_activo_id: String
      pais_id: String
      moneda_id: String
      mic: String
      sector_sfc: String
      iba_categoria: String

# Estados financieros consolidados publicados por cada compañía (respaldo de los emisores sin XBRL).
#
# Lo usa src/invest/ingest/estados_compania.py (fuente estados_compania, corre en el PC):
#   1. Descubre los PDF en las páginas índice (enlaces del HTML y direcciones .pdf dentro del código de
#      la página) y con las plantillas de URL; también toma los PDF que se pongan a mano en
#      invest-data/fuentes_compania/<emisor_id>/ (para los sitios con protección contra robots).
#   2. Baja solo lo nuevo (lo ya bajado no se vuelve a pedir; un 404 se reintenta cada
#      reintentar_404_dias) y lo guarda en invest-data/anexos/companias/<emisor_id>/ (repo privado).
#   3. Ubica las páginas del estado de situación financiera y del estado de resultados (y del de
#      cambios en el patrimonio, si hace falta para el patrimonio de la controladora) y envía solo esas
#      páginas a los dos agentes, con el mismo esquema de consenso de los dividendos.
#
# Unidades: cada documento dice las suyas ("cifras expresadas en millones de pesos"); los agentes las
# registran y el código lleva todo a pesos (o a dólares, unidad usd, para Mineros). Una misma compañía
# puede cambiar de unidad entre informes (Grupo Argos: miles en el trimestral de mar-2026, millones en
# el anual de 2025), por eso unidades_esperadas es una lista y solo produce un aviso.
#
# Verificación de las URL (24-nov-2026, búsqueda web y lectura del PDF): "verificada" = el PDF se leyó
# y se cotejaron título, periodo, unidades y cifras. Lo que no se pudo leer queda marcado y explicado.
# No se burlan protecciones: si un sitio responde con un desafío contra robots (Imperva Incapsula en
# argos.co y celsia.com) el emisor va como descarga: manual.
#
# Costo (precios de la API al 24-nov-2026: Sonnet 5.5 USD 2 / 10 y Opus 5.5 USD 4 / 20 por millón de
# tokens de entrada / salida; una página de PDF cuesta de 1.500 a 3.000 tokens de texto más hasta 1.568
# de imagen): con 4 a 8 páginas enviadas, unos 15.000 a 35.000 tokens de entrada por lectura.
#   - Consenso en la primera lectura (2 lecturas): USD 0,15 a 0,30 por documento.
#   - Con dos rondas de revisión cruzada (6 lecturas): USD 0,50 a 1,00 por documento.
#   - Con max_documentos_por_corrida = 6: a lo sumo unos USD 6 por corrida; en régimen, unos 7
#     emisores × 4 cortes = 28 documentos al año (USD 5 a 25 al año).
# Enviar el PDF completo costaría de 10 a 30 veces más (los informes tienen de 40 a 300 páginas).

agentes:            # si se omite, se usan los de config/extraccion.yaml
  a: {nombre: analista, modelo: claude-sonnet-5-5}
  b: {nombre: auditor, modelo: claude-opus-5-5}

limites:
  max_documentos_por_corrida: 6     # documentos enviados a la API por corrida (el resto queda pendiente)
  max_paginas_por_documento: 10     # páginas enviadas por documento (8 hasta el 24-nov-2026; +2 por el estado de flujos)
  max_descargas_por_corrida: 20     # PDF nuevos bajados por corrida
  tamano_maximo_mb: 40              # PDF más grandes no se bajan (GitHub avisa desde 50 MB por archivo)
  trimestres_plantilla: 4           # cortes hacia atrás que se prueban con las plantillas de URL
  dias_tras_corte_plantilla: 25     # una plantilla de un corte se empieza a probar estos días después
  reintentar_404_dias: 7
  paginas_si_no_hay_texto: 0        # PDF escaneado: 0 = no se envía (queda en cuarentena para mirar)

rondas_maximas: 2
max_tokens: 16000
tolerancia_balance: 0.01            # activos = pasivos + patrimonio_total, ± 1 %
tolerancia_controladora: 0.005      # patrimonio_controladora <= patrimonio_total (+ 0,5 %)

# Cómo se reconocen las páginas de los estados (texto sin tildes y en minúsculas)
paginas:
  situacion:
    titulos: ["estado de situacion financiera", "estados de situacion financiera", "estado consolidado de situacion financiera",
              "estados consolidados de situacion financiera", "balance general", "statement of financial position",
              "statements of financial position", "balance sheet"]
    claves: ["total activo", "total del activo", "activos totales", "total assets", "total pasivo", "total liabilities"]
    cierre: ["total pasivo y patrimonio", "total pasivos y patrimonio", "total patrimonio y pasivo", "total del pasivo y patrimonio",
             "total liabilities and equity", "total equity and liabilities"]
    paginas_extra: 2
  resultados:
    titulos: ["estado de resultados", "estados de resultados", "estado del resultado", "estados del resultado",
              "estado consolidado de resultados", "estados consolidados de resultados", "estado de ganancias y perdidas",
              "statement of profit or loss", "statements of profit or loss", "income statement", "statement of income",
              "statements of income", "statement of comprehensive income", "statements of comprehensive income"]
    claves: ["por accion", "per share", "atribuible", "attributable"]
    cierre: ["por accion", "per share"]
    paginas_extra: 1
  flujos:       # solo si hay espacio: la depreciación y amortización para el EBITDA
    titulos: ["estado de flujos de efectivo", "estados de flujos de efectivo", "estado consolidado de flujos de efectivo",
              "estados consolidados de flujos de efectivo", "estado de flujo de efectivo", "statement of cash flows",
              "statements of cash flows"]
    claves: ["depreciacion", "depreciation", "amortizacion", "amortization"]
    cierre: []
    paginas_extra: 0
  patrimonio:   # solo si hay espacio: algunos (Éxito) no traen la controladora en el balance
    titulos: ["cambios en el patrimonio", "changes in equity", "changes in shareholders"]
    claves: ["controladora", "controlling", "owners of the parent", "no controladora", "non-controlling"]
    cierre: []
    paginas_extra: 0

emisores:
  # ------------------------------------------------------------------ Grupo Argos
  - emisor_id: CO-COT09
    nombre: Grupo Argos
    descarga: automatica
    ventana: true      # la página índice pide una verificación a los programas (24-nov-2026): invest estados-ventana
    moneda: COP
    unidades_esperadas: [miles, millones]
    paginas_indice:
      - url: https://www.grupoargos.com/en/investor-relations/reports-and-presentations/
        nota: "Se leyó el 24-nov-2026 (lista 'Quarterly results'), pero los enlaces se arman con JavaScript: si el HTML no trae las direcciones, no se descubre nada y queda la carpeta manual"
      - url: https://www.grupoargos.com/relacion-con-el-inversionista/resultados-e-informes/reportes-financieros/
        nota: "Página en español enlazada desde /inversionistas/; no se pudo leer desde aquí (error del sitio): se intenta desde el PC"
    patrones:   # en orden de preferencia; uno por corte
      - 'files\.grupoargos\.com/.*(estados[-_ ]financieros[-_ ]consolidados|eeff[-_ ]consolidados)[^/]*\.pdf'
    excluir: ['separad', '[-_]en\.pdf', 'ingles', 'english', 'reporteintegrado']
    verificadas:
      - {url: "https://files.grupoargos.com/uploads-grupo-argos/2026/05/Estados_Financieros_Consolidados_Grupo_Argos_Marzo_2026.pdf", corte: 2026-03-31, unidades: miles, paginas_estados: "1-4 del cuerpo, unas 110 en total", nota: "activos 37.291.233.963 miles; controladora 87.257.032 miles (trimestre)"}
      - {url: "https://files.grupoargos.com/uploads-grupo-argos/2026/03/Grupo-Argos-Estados-Financieros-Consolidados-al-31-de-diciembre-2025.pdf", corte: 2025-12-31, unidades: millones, nota: "informe del revisor 2-mar-2026; activos 37.636.229 millones"}
    otros_formatos: "Informe periódico (Circular Externa 012) con separados y consolidados en un solo PDF (Circular-Externa-012-2T2026.pdf, consolidados desde la pág. 81, miles de pesos); 'IR Resultados' con tablas resumidas. Sin Excel ni XBRL propio verificado."

